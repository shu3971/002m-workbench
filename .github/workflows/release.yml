name: Build desktop releases

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - "Taskfile.yml"
      - "frontend/**"
      - "build/**"
      - "docs/**"
      - "README.md"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-amd64:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails v3 CLI
        shell: bash
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Static frontend checks
        shell: bash
        run: |
          node --check frontend/dist/app.js
          test -f frontend/dist/index.html
          test -f frontend/dist/style.css
          test -f frontend/dist/mark.svg
          test -f frontend/dist/data/cases.json

      - name: Go vet
        run: go vet ./...

      - name: Build
        shell: bash
        run: |
          export PATH="/c/Program Files/Git/usr/bin:$PATH"
          wails3 build

      - name: Stage artifact
        shell: bash
        run: cp bin/002m-workbench.exe 002m-workbench-windows-amd64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: 002m-workbench-windows-amd64.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 (CGO-free cross build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Static frontend checks
        shell: bash
        run: |
          node --check frontend/dist/app.js
          test -f frontend/dist/index.html
          test -f frontend/dist/style.css
          test -f frontend/dist/mark.svg
          test -f frontend/dist/data/cases.json

      - name: Build CGO-free macOS arm64 binary
        shell: bash
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -tags "production,purego" -trimpath -buildvcs=false -ldflags="-w -s" -o bin/002m-workbench .

      - name: Assemble .app bundle
        shell: bash
        run: |
          test -f "bin/002m-workbench"
          test "$(go version -m bin/002m-workbench | head -1)" != ""
          rm -rf "bin/002m-workbench.app"
          mkdir -p "bin/002m-workbench.app/Contents/MacOS" "bin/002m-workbench.app/Contents/Resources"
          cp "bin/002m-workbench" "bin/002m-workbench.app/Contents/MacOS/002m-workbench"
          cp "build/darwin/Info.plist" "bin/002m-workbench.app/Contents/Info.plist"
          cp "build/darwin/icons.icns" "bin/002m-workbench.app/Contents/Resources/icons.icns"
          if [ -f "build/darwin/Assets.car" ]; then cp "build/darwin/Assets.car" "bin/002m-workbench.app/Contents/Resources/Assets.car"; fi
          file "bin/002m-workbench.app/Contents/MacOS/002m-workbench"

      - name: Package app
        shell: bash
        run: |
          test -d "bin/002m-workbench.app"
          cd bin
          "/c/Program Files/7-Zip/7z.exe" a -tzip "../002m-workbench-macos-arm64.zip" "002m-workbench.app"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: 002m-workbench-macos-arm64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-amd64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/002m-workbench-windows-amd64.exe
            dist/002m-workbench-macos-arm64.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
